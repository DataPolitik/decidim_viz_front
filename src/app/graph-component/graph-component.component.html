<div class="graph">
  <plotly-plot
    *ngIf="figure"
    [data]="figure.data"
    [layout]="figure.layout"
    [config]="plotConfig"
    [useResizeHandler]="true"
    [style]="{position: 'relative', width: '100%', height: '100%'}">
  </plotly-plot>
  <p *ngIf="figure && figure.isolatedCount" class="graph_note">
    {{ 'interactions.isolated_hidden' | translate: {count: figure.isolatedCount} }}
  </p>
  <p *ngIf="failed" class="graph_note">{{ 'interactions.graph_error' | translate }}</p>
</div>
